[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hunterkiller"
version = "0.4.0"
description = "Hunter Killer Desk Read client: check where liquidation money is stacked before a leveraged trade, and watch for walls coming into range."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []
keywords = ["crypto", "liquidations", "perpetuals", "trading", "agents", "mcp"]

[project.urls]
Homepage = "https://hunterkiller.io/for-agents"

[tool.setuptools]
packages = ["hunterkiller"]
